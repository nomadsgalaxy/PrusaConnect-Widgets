name: Build installer

# Builds the MSIX, signs it with a freshly generated self-signed cert, and
# bundles the package + cert + install.ps1 into a zip anyone can sideload
# without a build toolchain. On a v* tag it also attaches the zip to a Release.
#
# Why not an MSI: a Windows Widgets provider has to be registered as an MSIX
# package (the widget extension lives in the package manifest), so an MSI can't
# install it. We ship the signed MSIX plus a one-line PowerShell installer.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets tag builds attach the zip to a Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create a self-signed signing cert
        shell: pwsh
        run: |
          # The cert subject must match the package Publisher exactly
          # (Package.appxmanifest: Publisher="CN=PrusaConnectWidget.DevSign").
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=PrusaConnectWidget.DevSign' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\PrusaConnectWidget.cer" | Out-Null
          "CERT_THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the signed MSIX
        shell: pwsh
        run: |
          msbuild src\Widget\PrusaConnect.Widget.csproj /restore `
            /p:Configuration=Debug /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$env:CERT_THUMB `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed ($LASTEXITCODE)" }

      - name: Stage the installer bundle
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Recurse -Filter *.msix |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $msix) { throw "no .msix was produced" }
          Write-Host "Found package: $($msix.FullName)"

          $out = "$env:RUNNER_TEMP\installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $msix.FullName             (Join-Path $out $msix.Name)
          Copy-Item "$env:RUNNER_TEMP\PrusaConnectWidget.cer" (Join-Path $out 'PrusaConnectWidget.cer')
          Copy-Item '.github\installer\install.ps1'           (Join-Path $out 'install.ps1')
          Copy-Item '.github\installer\README.txt'            (Join-Path $out 'README.txt')

          $zip = "$env:RUNNER_TEMP\PrusaConnectWidget-installer.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrusaConnectWidget-installer
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ env.ZIP }}
          body: |
            Prusa Connect Widget - sideload installer.

            1. Download PrusaConnectWidget-installer.zip below and unzip it.
            2. Right-click install.ps1 and Run with PowerShell (it needs admin to trust the cert).
            3. Open the Widgets Board (Win+W), add a "Prusa Connect - 1..4" tile, and set it
               in the Prusa Connect Widget app from the Start menu.

            Requires Windows 11 and being signed into Prusa Connect in PrusaSlicer.
